<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusMode</title>
  <link rel="icon" type="image/svg+xml" href="focusmode.svg" />
  <link rel="shortcut icon" href="focusmode.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background Layer -->
  <div id="bg-layer" class="bg-layer"></div>
  <div id="bg-overlay" class="bg-overlay"></div>

  <!-- Top Focus Mode Header -->
  <div id="focus-header" class="focus-header hidden">
    <div class="focus-header-pill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
      </svg>
      <span>Focusing</span>
      <button id="stop-focus-btn" class="stop-btn" title="Stop focus session">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Top Left Controls -->
  <div class="top-left-controls">
    <button id="sound-toggle-btn" class="icon-btn" title="Toggle ambient sound">
      <svg id="sound-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </button>
    <div id="volume-slider-wrap" class="volume-slider-wrap hidden">
      <input type="range" id="volume-slider" min="0" max="100" value="60" class="volume-slider" />
    </div>
    <button id="settings-btn" class="icon-btn" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Top Right Controls -->
  <div class="top-right-controls">
    <div class="session-indicator" id="session-indicator">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span id="session-count-display">Session 1</span>
    </div>
    <button id="fullscreen-btn" class="icon-btn" title="Toggle fullscreen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>

  <!-- Main Content Area -->
  <main class="main-content">

    <!-- FOCUS / BREAK Tabs -->
    <div class="mode-tabs">
      <button id="focus-tab" class="mode-tab active" data-mode="focus">FOCUS</button>
      <button id="break-tab" class="mode-tab" data-mode="break">BREAK</button>
    </div>

    <!-- Timer Circle Container -->
    <div class="timer-circle-container">
      <!-- SVG Progress Ring -->
      <svg class="progress-ring" viewBox="0 0 400 400" id="progress-ring-svg">
        <circle class="ring-track" cx="200" cy="200" r="175" />
        <circle class="ring-progress" cx="200" cy="200" r="175" id="ring-progress-circle" />
      </svg>

      <!-- Timer Content -->
      <div class="timer-content">
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="focus-topic-display" id="focus-topic-display">
          <span id="topic-text" class="topic-placeholder">I will focus on...</span>
        </div>
        <!-- Play/Pause Button -->
        <div class="play-pause-wrap">
          <button id="play-pause-btn" class="play-pause-btn" title="Start/Pause">
            <svg id="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
            <svg id="pause-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" class="hidden">
              <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Three-dot Menu Button -->
      <button id="three-dot-btn" class="three-dot-btn" title="Options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
        </svg>
      </button>
    </div>

    <!-- Motivational Quote -->
    <div class="quote-area">
      <p id="motivational-quote" class="motivational-quote"></p>
    </div>

  </main>

  <!-- Today's Tasks Panel -->
  <div id="tasks-panel" class="tasks-panel">
    <div class="tasks-header">
      <div class="tasks-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        Today's Tasks
      </div>
      <button id="tasks-menu-btn" class="icon-btn-sm" title="Tasks options">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
        </svg>
      </button>
    </div>
    <div id="tasks-list" class="tasks-list"></div>
    <div class="add-task-row">
      <button id="add-task-btn" class="add-task-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New task
      </button>
    </div>
    <div id="add-task-form" class="add-task-form hidden">
      <input type="text" id="new-task-input" class="new-task-input" placeholder="What's your task?" maxlength="80" />
      <div class="add-task-actions">
        <button id="save-task-btn" class="save-task-btn">Add</button>
        <button id="cancel-task-btn" class="cancel-task-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Three-dot Context Menu -->
  <div id="pomodoro-menu" class="pomodoro-menu hidden">
    <div class="menu-section">
      <div class="menu-section-title">Pomodoro</div>
      <button class="menu-item" id="menu-complete">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Complete timer
      </button>
      <button class="menu-item" id="menu-restart">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        Restart timer
      </button>
      <button class="menu-item" id="menu-add5">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Add 5 minutes
      </button>
      <button class="menu-item" id="menu-add10">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Add 10 minutes
      </button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <div class="menu-duration-row">
        <span>Focus</span>
        <div class="menu-duration-ctrl">
          <button class="dur-btn" data-type="focus" data-action="dec">−</button>
          <span id="menu-focus-dur">25 min</span>
          <button class="dur-btn" data-type="focus" data-action="inc">+</button>
        </div>
      </div>
      <div class="menu-duration-row">
        <span>Break</span>
        <div class="menu-duration-ctrl">
          <button class="dur-btn" data-type="break" data-action="dec">−</button>
          <span id="menu-break-dur">5 min</span>
          <button class="dur-btn" data-type="break" data-action="inc">+</button>
        </div>
      </div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <div class="menu-toggle-row">
        <span>Timer sound effects</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-sound-effects" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="menu-toggle-row">
        <span>Auto-start timers</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-autostart" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="menu-toggle-row">
        <span>Hide seconds</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-hide-seconds" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="menu-toggle-row">
        <span>Browser notifications</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-notifications" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Completion Notification -->
  <div id="completion-notification" class="completion-notification hidden">
    <div class="completion-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:rgba(255,255,255,0.9)">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <div class="completion-text">
      <strong>Great work!</strong>
      <span id="completion-message">Focus session complete</span>
    </div>
    <div class="completion-actions">
      <button id="continue-focus-btn" class="comp-btn comp-btn-primary">Continue focusing</button>
      <button id="stop-focus-mode-btn" class="comp-btn comp-btn-secondary">Stop focus mode</button>
    </div>
  </div>

  <!-- Break Notification -->
  <div id="break-notification" class="completion-notification hidden">
    <div class="completion-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:rgba(255,255,255,0.9)">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </div>
    <div class="completion-text">
      <strong>Break's over!</strong>
      <span>Ready to focus again?</span>
    </div>
    <div class="completion-actions">
      <button id="start-focus-again-btn" class="comp-btn comp-btn-primary">Start focusing</button>
      <button id="dismiss-break-btn" class="comp-btn comp-btn-secondary">Dismiss</button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-overlay" id="settings-overlay"></div>
    <div class="settings-content">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="close-settings-btn" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="settings-section">
        <h3>Timer Durations</h3>
        <div class="settings-row">
          <label>Focus duration</label>
          <div class="settings-input-group">
            <select id="settings-focus-dur">
              <option value="1">1 min</option>
              <option value="5">5 min</option>
              <option value="10">10 min</option>
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="25" selected>25 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="50">50 min</option>
              <option value="60">60 min</option>
              <option value="90">90 min</option>
              <option value="custom">Custom...</option>
            </select>
            <input type="number" id="settings-focus-custom" class="hidden" min="1" max="180" placeholder="Min" />
          </div>
        </div>
        <div class="settings-row">
          <label>Break duration</label>
          <div class="settings-input-group">
            <select id="settings-break-dur">
              <option value="1">1 min</option>
              <option value="3">3 min</option>
              <option value="5" selected>5 min</option>
              <option value="10">10 min</option>
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="custom">Custom...</option>
            </select>
            <input type="number" id="settings-break-custom" class="hidden" min="1" max="60" placeholder="Min" />
          </div>
        </div>
        <div class="settings-row">
          <label>Long break duration</label>
          <div class="settings-input-group">
            <select id="settings-long-break-dur">
              <option value="10">10 min</option>
              <option value="15" selected>15 min</option>
              <option value="20">20 min</option>
              <option value="30">30 min</option>
              <option value="custom">Custom...</option>
            </select>
            <input type="number" id="settings-long-break-custom" class="hidden" min="1" max="90" placeholder="Min" />
          </div>
        </div>
        <div class="settings-row">
          <label>Sessions before long break</label>
          <select id="settings-sessions">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>
      </div>

      <div class="settings-section">
        <h3>Behavior</h3>
        <div class="settings-row">
          <label>Auto-start focus after break</label>
          <label class="toggle-switch">
            <input type="checkbox" id="settings-autostart-focus" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <label>Auto-start break after focus</label>
          <label class="toggle-switch">
            <input type="checkbox" id="settings-autostart-break" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <label>Hide seconds</label>
          <label class="toggle-switch">
            <input type="checkbox" id="settings-hide-seconds" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <h3>Sound & Notifications</h3>
        <div class="settings-row">
          <label>Timer sound effects</label>
          <label class="toggle-switch">
            <input type="checkbox" id="settings-sound-effects" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <label>Ambient music</label>
          <label class="toggle-switch">
            <input type="checkbox" id="settings-ambient" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <label>Volume</label>
          <input type="range" id="settings-volume" min="0" max="100" value="60" class="volume-slider wide" />
        </div>
        <div class="settings-row">
          <label>Browser notifications</label>
          <label class="toggle-switch">
            <input type="checkbox" id="settings-notifications" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <button id="save-settings-btn" class="save-settings-btn">Save Settings</button>
    </div>
  </div>

  <!-- Confetti Container -->
  <div id="confetti-container" class="confetti-container"></div>

  <!-- Audio Element -->
  <audio id="ambient-audio" loop>
    <source src="Interstellar - Hans Zimmer (Soft Version) Sleep, Study, Relax - 1 Hour.mp3" type="audio/mpeg" />
  </audio>
  <audio id="ding-audio" preload="auto">
    <!-- Inline beep generated via Web Audio API in JS -->
  </audio>

  <!-- Focus Topic Input Overlay (shown when clicking topic) -->
  <div id="topic-input-overlay" class="topic-input-overlay hidden">
    <input type="text" id="topic-input" class="topic-input-field" placeholder="I will focus on..." maxlength="60" />
  </div>

  <script src="app.js"></script>
</body>
</html>
